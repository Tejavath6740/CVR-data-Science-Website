<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Cards</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: Arial, sans-serif;
  }

  .cards {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .card {
    width: 180px;
    height: 120px;
    padding: 25px;
    border-radius: 18px;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 22px;
    font-weight: bold;

    animation: wave 2s ease-in-out infinite;
  }

  .card:nth-child(2) {
    animation-delay: 0.2s;
  }

  .card:nth-child(3) {
    animation-delay: 0.4s;
  }

  .card:nth-child(4) {
    animation-delay: 0.6s;
  }

  .card:nth-child(5) {
    animation-delay: 0.8s;
  }

  @keyframes wave {
    0%, 100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-35px);
    }
  }
</style>
</head>

<body>

<div class="cards">
  <div class="card">HTML</div>
  <div class="card">CSS</div>
  <div class="card">JavaScript</div>
  <div class="card">React</div>
  <div class="card">Design</div>
</div>

</body>
</html>
